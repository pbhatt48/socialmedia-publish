[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instagram-publisher-mcp"
version = "0.1.0"
description = "MCP server that publishes queued posts to an Instagram account via the official Instagram API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
instagram-mcp = "instagram_publisher.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_publisher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
