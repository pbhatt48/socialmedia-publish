<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Pagella;src:url(fonts/texgyrepagella-regular.otf)}
  @font-face{font-family:Pagella;font-style:italic;src:url(fonts/texgyrepagella-italic.otf)}
  @font-face{font-family:Inter;src:url(fonts/Inter-Regular.woff2)}
  :root{--bg:#0d0f12;--ink:#efe8d8;--gold:#c9a96a;--gold-dim:rgba(201,169,106,.55);--mute:#8a8578}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:var(--bg);overflow:hidden}
  .card{position:relative;width:1080px;height:1350px;
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, rgba(201,169,106,.10), transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 110%, rgba(0,0,0,.6), transparent 60%),
      linear-gradient(#111419,#0b0d10);
    color:var(--ink);font-family:Pagella,serif}
  .grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
  .frame{position:absolute;inset:36px;border:1px solid rgba(201,169,106,.22)}
  .eyebrow{position:absolute;top:78px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px;
    font-family:Inter,sans-serif;font-size:17px;letter-spacing:.38em;color:var(--gold);text-transform:uppercase}
  .eyebrow i{display:block;width:90px;height:1px;background:var(--gold-dim)}
  #art{position:absolute;top:130px;left:90px;width:900px;height:520px;overflow:hidden}
  .quote{position:absolute;top:700px;left:110px;right:110px;text-align:center;
    font-style:italic;font-size:76px;line-height:1.14;color:var(--ink);letter-spacing:-.005em}
  .quote .mk{color:var(--gold)}
  .byline{position:absolute;top:985px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:36px}
  .medal{width:150px;height:150px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 38% 32%, #2a2620, #14130f 70%);
    box-shadow:0 0 0 1px var(--gold-dim), 0 0 0 8px #0d0f12, 0 0 0 9px rgba(201,169,106,.3), 0 20px 50px rgba(0,0,0,.6)}
  .medal svg{position:absolute;inset:0}
  .medal span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:58px;color:var(--gold);letter-spacing:.04em}
  .who .name{font-size:50px;letter-spacing:.2em;color:var(--ink);line-height:1}
  .who .role{margin-top:16px;font-family:Inter,sans-serif;font-size:20px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
  .who .src{margin-top:10px;font-style:italic;font-size:22px;color:var(--mute)}
  .footer{position:absolute;bottom:78px;left:0;right:0;text-align:center;
    font-family:Inter,sans-serif;font-size:17px;letter-spacing:.42em;text-transform:uppercase;color:var(--mute)}
  .footer:before{content:"";display:block;width:60px;height:1px;background:var(--gold-dim);margin:0 auto 26px}
</style></head>
<body><div class="card">
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="frame"></div>
  <div class="eyebrow"><i></i><span id="eyebrow"></span><i></i></div>
  <svg id="art" viewBox="0 0 900 520"></svg>
  <div class="quote" id="quote"></div>
  <div class="byline">
    <div class="medal">
      <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="rgba(201,169,106,.35)" stroke-width="1" stroke-dasharray="1 4"/></svg>
      <span id="mono"></span>
    </div>
    <div class="who">
      <div class="name" id="name"></div>
      <div class="role" id="role"></div>
      <div class="src" id="src"></div>
    </div>
  </div>
  <div class="footer">Learn. Think. Allocate. Compound.</div>
</div>
<script>
const P = window.POST;
document.getElementById('eyebrow').textContent = P.eyebrow;
document.getElementById('quote').innerHTML = '<span class="mk">“</span>' + P.quote + '<span class="mk">”</span>';
if (P.quoteSize) document.getElementById('quote').style.fontSize = P.quoteSize + 'px';
document.getElementById('name').textContent = P.name.toUpperCase();
document.getElementById('role').textContent = P.role;
document.getElementById('src').textContent = P.source;
document.getElementById('mono').textContent = P.name.split(/\s+/).map(w=>w[0]).join('');
document.getElementById('art').innerHTML = P.art;
</script>
</body></html>
